// Adia — un APK: runtime local (opencode + Termux/proot) + frontend Compose.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Adia"
include(":app")

// Frontend: copia interna en client/. Sin submodulos: el cliente de LAN
// (a2heng/opencode-android-ui) y Adia evolucionan por separado.
include(":client")
project(":client").projectDir = file("client")
