// Adia — un APK: runtime local (opencode + Termux/proot) + frontend Compose.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Adia"
include(":app")

// Frontend (OpenCode Mobile) vive como submodulo y se compila dentro de este APK:
// no hay que instalar ninguna app aparte.
include(":client")
project(":client").projectDir = file("mobile/opencode-mobile/client")
