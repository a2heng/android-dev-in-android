# Release: push a semantic tag `vX.Y.Z`.
# `workflow_dispatch` builds a signed APK without creating a Release.
# Signed release only. Required secrets:
#   ADIA_KEYSTORE_BASE64, ADIA_KEY_ALIAS, ADIA_KEYSTORE_PASS, ADIA_KEY_PASS
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag must look like vX.Y.Z (current: ${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          CODE=$(printf '%s' "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms
        run: |
          yes | sdkmanager "platforms;android-34" "platforms;android-36" "platforms;android-37.0" "build-tools;34.0.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ADIA_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ADIA_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ADIA_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.ADIA_KEY_PASS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ADIA_KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ] && missing="$missing ADIA_KEY_ALIAS"
          [ -z "$KEYSTORE_PASS" ] && missing="$missing ADIA_KEYSTORE_PASS"
          [ -z "$KEY_PASS" ] && missing="$missing ADIA_KEY_PASS"
          if [ -n "$missing" ]; then
            echo "Missing release signing secrets:$missing" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Fetch opencode runtime
        run: python3 scripts/fetch-opencode.py --version 2.3.0

      - name: Fetch offline Termux toolbox
        run: python3 scripts/fetch-toolbox.py

      - name: Verify offline toolbox (bash/readline/symlinks/DT_NEEDED)
        run: python3 scripts/verify-toolbox.py

      - name: Warm Gradle cache for the bundled toolchain
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Warm common Android dependencies (small, high-frequency set)
        run: |
          ./gradlew -p scripts/fixtures/common-deps resolveCommon \
            --console=plain --no-daemon

      - name: Build offline toolchain bundle
        run: python3 scripts/make-toolchain.py

      - name: Build signed release
        env:
          ADIA_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          ADIA_KEY_ALIAS: ${{ secrets.ADIA_KEY_ALIAS }}
          ADIA_KEYSTORE_PASS: ${{ secrets.ADIA_KEYSTORE_PASS }}
          ADIA_KEY_PASS: ${{ secrets.ADIA_KEY_PASS }}
        run: |
          ./gradlew :app:assembleRelease --console=plain --stacktrace --no-daemon \
            -PadiaVersionName="${{ steps.version.outputs.name }}" \
            -PadiaVersionCode="${{ steps.version.outputs.code }}" \
            -PadiaRequireSigning=1

      - name: 16 KB check
        env:
          ADIA_16KB_STRICT: "1"
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          python3 app/src/main/assets/skills/android-build/scripts/check-16kb.py "$APK"

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Rename and checksum
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="adia-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "out/$NAME"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: adia-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Adia $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
