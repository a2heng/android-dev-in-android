# Release: push a semantic tag `vX.Y.Z`.
# `workflow_dispatch` builds without creating a Release.
# If signing secrets are present, produces a signed release APK.
# Otherwise produces a debug-signed preview APK (clearly labelled).
# Secrets (optional): ADIA_KEYSTORE_BASE64, ADIA_KEY_ALIAS,
#                     ADIA_KEYSTORE_PASS, ADIA_KEY_PASS.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag must look like vX.Y.Z (current: ${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          CODE=$(printf '%s' "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 34
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ADIA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ADIA_KEYSTORE_BASE64: building a debug-signed preview." >&2
            echo "signed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "signed=1" >> "$GITHUB_OUTPUT"

      - name: Fetch opencode runtime
        run: python3 scripts/fetch-opencode.py --version 2.2.6

      - name: Fetch offline Termux toolbox
        run: python3 scripts/fetch-toolbox.py

      - name: Warm Gradle cache for the bundled toolchain
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Build offline toolchain bundle
        run: python3 scripts/make-toolchain.py

      - name: Build signed release
        if: steps.signing.outputs.signed == '1'
        env:
          ADIA_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          ADIA_KEY_ALIAS: ${{ secrets.ADIA_KEY_ALIAS }}
          ADIA_KEYSTORE_PASS: ${{ secrets.ADIA_KEYSTORE_PASS }}
          ADIA_KEY_PASS: ${{ secrets.ADIA_KEY_PASS }}
        run: |
          ./gradlew :app:assembleRelease --console=plain --stacktrace --no-daemon \
            -PadiaVersionName="${{ steps.version.outputs.name }}" \
            -PadiaVersionCode="${{ steps.version.outputs.code }}" \
            -PadiaRequireSigning=1

      - name: Build debug preview
        if: steps.signing.outputs.signed != '1'
        run: |
          ./gradlew :app:assembleDebug --console=plain --stacktrace --no-daemon \
            -PadiaVersionName="${{ steps.version.outputs.name }}" \
            -PadiaVersionCode="${{ steps.version.outputs.code }}"

      - name: 16 KB check
        env:
          ADIA_16KB_STRICT: "1"
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || ls app/build/outputs/apk/debug/*.apk)
          python3 app/src/main/assets/skills/android-build/scripts/check-16kb.py "$APK"

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || ls app/build/outputs/apk/debug/*.apk)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Rename and checksum
        run: |
          mkdir -p out
          if [ "${{ steps.signing.outputs.signed }}" = "1" ]; then
            SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
            NAME="adia-${{ steps.version.outputs.name }}.apk"
          else
            SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            NAME="adia-${{ steps.version.outputs.name }}-preview-debug.apk"
          fi
          cp "$SRC" "out/$NAME"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: adia-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Adia $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
